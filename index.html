<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহজ To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #333;
            font-size: 26px;
            margin-bottom: 5px;
            text-align: center;
        }

        .header p {
            color: #777;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #667eea;
        }

        .input-group button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .input-group button:hover {
            background: #5a67d8;
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        .task-list {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .task-list::-webkit-scrollbar {
            width: 6px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.2s;
        }

        .task-item:hover {
            background: #f1f5f9;
        }

        .task-item.completed {
            border-left-color: #10b981;
            opacity: 0.7;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
            user-select: none;
        }

        .task-content input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #10b981;
        }

        .task-text {
            font-size: 15px;
            color: #334155;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background: #fee2e2;
        }

        .empty-message {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 20px 0;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            color: #64748b;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="todo-card">
        <div class="header">
            <h1>📋 To-Do List</h1>
            <p>আপনার প্রতিদিনের কাজের তালিকা সাজিয়ে রাখুন</p>
        </div>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="নতুন কাজ লিখুন..." autocomplete="off">
            <button id="addBtn">যোগ করুন</button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="footer-info">
            <span id="taskCount">০ টি কাজ বাকি</span>
            <button class="clear-btn" id="clearAllBtn">সব মুছুন</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');
        const taskCount = document.getElementById('taskCount');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // লোড হওয়া টাস্ক
        let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];

        // সংখ্যা বাংলায় রূপান্তর
        function toBengaliNumber(num) {
            const bengaliDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, d => bengaliDigits[d]);
        }

        // লোকাল স্টোরেজে সংরক্ষণ
        function saveTasks() {
            localStorage.setItem('my_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // টাস্ক রেন্ডার করা
        function renderTasks() {
            taskList.innerHTML = '';

            if (tasks.length === 0) {
                taskList.innerHTML = '<li class="empty-message">কোনো কাজ বাকি নেই! নতুন কাজ যোগ করুন।</li>';
            } else {
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;

                    li.innerHTML = `
                        <div class="task-content" onclick="toggleTask(${index})">
                            <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${index})">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${index})" title="মুছে ফেলুন">✕</button>
                    `;

                    taskList.appendChild(li);
                });
            }

            // বাকি থাকা কাজের হিসাব
            const remaining = tasks.filter(t => !t.completed).length;
            taskCount.textContent = `${toBengaliNumber(remaining)} টি কাজ বাকি`;
        }

        // নতুন কাজ যোগ করা
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            tasks.unshift({
                text: text,
                completed: false
            });

            taskInput.value = '';
            taskInput.focus();
            saveTasks();
        }

        // টাস্ক সম্পন্ন / অসম্পন্ন টগল
        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
        }

        // টাস্ক মুছে ফেলা
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
        }

        // সব মুছে ফেলা
        clearAllBtn.addEventListener('click', () => {
            if (tasks.length === 0) return;
            if (confirm('আপনি কি সত্যিই সব টাস্ক মুছে ফেলতে চান?')) {
                tasks = [];
                saveTasks();
            }
        });

        // HTML Escape করা যাতে XSS না হয়
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ইভেন্ট লিসেনার
        addBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // প্রথমবার পেজ লোডে রেন্ডার
        renderTasks();
    </script>
</body>
</html>
